name: Get apps versions

on:
  schedule:
    - cron:  '0 6 * * *'
      timezone: 'Europe/Berlin'
  push:
    paths:
    - 'release-version/force'

jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_CR }}

      - name: Fetch release version
        run: |
          curl https://api.github.com/repos/Heroic-Games-Launcher/HeroicGamesLauncher/releases/latest  | \
          jq -r ".tag_name" > release-version/Heroic-latest.txt
          cat release-version/Heroic-latest.txt

      - name: Check for modified files
        id: git-check
        run: |
            echo "modified=$( [ -z "$(git status --porcelain)" ] && echo false || echo true )" >> "$GITHUB_OUTPUT"

      - name: Commit latest release version and push
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'Spikybee'
          git config --global user.email '87238479+Spikybee@users.noreply.github.com'
          git commit -am "New release version"
          git push
